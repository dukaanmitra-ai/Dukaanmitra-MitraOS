<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e27;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c9a227;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="url(#logoGradient)" opacity="0.1" />

  <!-- Store Icon -->
  <g transform="translate(50, 40)">
    <!-- Store Base -->
    <rect x="10" y="60" width="80" height="60" rx="4" fill="#0a0e27" />
    <rect x="10" y="60" width="80" height="60" rx="4" fill="none" stroke="#c9a227" stroke-width="2" />

    <!-- Awning -->
    <path d="M0 60 L10 40 L40 35 L70 40 L90 35 L100 60 Z" fill="#c9a227" />
    <path d="M0 60 L10 40 L40 35 L70 40 L90 35 L100 60 Z" fill="none" stroke="#0a0e27" stroke-width="2" />

    <!-- Awning Stripes -->
    <line x1="25" y1="40" x2="25" y2="60" stroke="#0a0e27" stroke-width="2" />
    <line x1="50" y1="35" x2="50" y2="60" stroke="#0a0e27" stroke-width="2" />
    <line x1="75" y1="40" x2="75" y2="60" stroke="#0a0e27" stroke-width="2" />

    <!-- Door -->
    <rect x="35" y="75" width="30" height="45" rx="2" fill="#f7f5f0" />
    <circle cx="60" cy="97" r="3" fill="#c9a227" />

    <!-- Windows -->
    <rect x="15" y="75" width="15" height="20" rx="2" fill="#f7f5f0" />
    <rect x="70" y="75" width="15" height="20" rx="2" fill="#f7f5f0" />
  </g>

  <!-- DukaanMitra Text -->
  <text x="100" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#0a0e27">DukaanMitra</text>
  <text x="100" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">Your Business Partner</text>
</svg>
